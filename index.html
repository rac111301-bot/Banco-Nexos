<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Cliente - Banco Nexus</title>
    <!-- Importando uma fonte moderna do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-area h1 {
            color: #0f172a;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .logo-area span {
            color: #2563eb;
        }
        .logo-area p {
            font-size: 13px;
            color: #64748b;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
        .footer-links {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
        }
        .footer-links a {
            color: #2563eb;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .security-badge {
            margin-top: 30px;
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho da Instituição Fictícia -->
        <div class="logo-area">
            <h1>Banco <span>Nexus</span></h1>
            <p>Ambiente Seguro de Acesso ao Internet Banking</p>
        </div>

        <!-- Formulário de Login (Seguro e Educacional) -->
        <form onsubmit="alert('Esta é uma página de demonstração/estudo para o GitHub Pages!'); return false;">
            <div class="form-group">
                <label for="conta">Agência e Conta / CPF</label>
                <input type="text" id="conta" placeholder="Digite seu identificador" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha de Acesso</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Acessar Conta</button>
        </form>

        <div class="footer-links">
            <a href="#">Esqueceu sua senha?</a> | <a href="#">Abrir conta</a>
        </div>

        <div class="security-badge">
            🔒 Conexão Criptografada de Ponta a Ponta (Demonstração)
        </div>
    </div>

</body>
</html>
